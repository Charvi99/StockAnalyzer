# Binary Classification Configuration
# Optimized for buy/sell signal prediction

extends: configs/default

labels:
  type: "binary"

training:
  n_trials: 20
  eval_metric: "auc"

models:
  xgboost:
    learning_rate: 0.01
    max_depth: 6
    n_estimators: 500

  catboost:
    learning_rate: 0.01
    depth: 8
    iterations: 1000
