
# Default log rotation — prevents disk-fill on long unattended runs.
# Each container's logs capped at 3 files x 10MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  database:
    image: timescale/timescaledb:latest-pg14
    container_name: stock_analyzer_db
    environment:
      POSTGRES_DB: stock_analyzer
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql is no longer used - we use Alembic migrations instead
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stock_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped  # auto-restart on host reboot (data collection must survive)

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analyzer_backend
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://stockuser:stockpass123@database:5432/stock_analyzer
      PYTHONUNBUFFERED: 1
      POLYGON_API_KEY: ${POLYGON_API_KEY:-demo}  # Set in .env file
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_models:/app/ml/models
      - ml_models:/app/ml_models  # Access to trained ML models
      - ./ml_training:/app/ml_training
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped  # auto-restart on host reboot
    # Command is now handled by start.sh script in Dockerfile

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_analyzer_frontend
    environment:
      # REACT_APP_API_URL intentionally unset — api.js derives the backend host from
      # window.location so the UI works via localhost, Tailscale IP, or LAN IP.
      HOST: 0.0.0.0
    ports:
      - "3000:3000"  # Use standard React port (outside dynamic range)
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

  # ============================================
  # REDIS - Message Broker + Result Backend
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: stock_analyzer_redis
    restart: unless-stopped
    ports:
      - "7379:6379"  # Redis on high port (7xxx = safe zone, above Windows conflicts)
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # CELERY WORKER - Background Task Execution
  # ============================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analyzer_celery_worker
    logging: *default-logging
    restart: unless-stopped
    # I/O-bound (Polygon API waits + inter-stock sleeps) — safe to run above core count.
    # Fetcher + maintenance only; CPU-bound analysis runs on the dedicated celery_processor.
    command: celery -A app.celery_app worker --loglevel=info --concurrency=8 --queues=fetcher,maintenance
    environment:
      DATABASE_URL: postgresql://stockuser:stockpass123@database:5432/stock_analyzer
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POLYGON_API_KEY: ${POLYGON_API_KEY:-demo}
      PYTHONUNBUFFERED: 1
      # Alert delivery (Phase 1.11) — optional. The check_ledger_health task always
      # logs; it pushes to a webhook / SMTP email only when these are set in .env.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-slack}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_models:/app/ml/models
      - ml_models:/app/ml_models  # Access to trained ML models

  # ============================================
  # CELERY PROCESSOR WORKER - CPU-bound analysis (chart patterns, indicators)
  # Dedicated pool so CPU-bound analysis never contends with I/O-bound fetching.
  # Concurrency capped below core count (8 cores) to leave headroom for the
  # fetcher bursts + backend/db/frontend.
  # ============================================
  celery_processor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analyzer_celery_processor
    logging: *default-logging
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=6 --queues=processor
    environment:
      DATABASE_URL: postgresql://stockuser:stockpass123@database:5432/stock_analyzer
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POLYGON_API_KEY: ${POLYGON_API_KEY:-demo}
      PYTHONUNBUFFERED: 1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_models:/app/ml/models
      - ml_models:/app/ml_models  # Access to trained ML models

  # ============================================
  # CELERY BEAT - Periodic Task Scheduler
  # ============================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analyzer_celery_beat
    logging: *default-logging
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://stockuser:stockpass123@database:5432/stock_analyzer
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONUNBUFFERED: 1
    depends_on:
      - database
      - redis
    volumes:
      - ./backend:/app

  # ============================================
  # FLOWER - Celery Monitoring Dashboard
  # ============================================
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_analyzer_flower
    restart: unless-stopped
    command: celery -A app.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5555:5555"  # Standard Flower port (safe from Windows dynamic range)

  # ============================================
  # ML TRAINING - Machine Learning Model Training
  # ============================================
  ml-training:
    build:
      context: ./ml-training
      dockerfile: Dockerfile
    container_name: stock_analyzer_ml_training
    environment:
      DATABASE_URL: postgresql://stockuser:stockpass123@database:5432/stock_analyzer
      PYTHONUNBUFFERED: 1
      PYTHONPATH: "/backend:/app"  # Allow importing backend services
    volumes:
      - ./ml-training:/app
      - ./backend:/backend  # Mount backend to access services
      - ml_models:/app/outputs/models  # Trained models (shared with backend)
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8888:8888"  # Expose JupyterLab port
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  backend_models:
  frontend_node_modules:
  redis_data:
  ml_models:  # ML trained models (shared between ml-training and backend)
  ml_features:  # ML feature cache
